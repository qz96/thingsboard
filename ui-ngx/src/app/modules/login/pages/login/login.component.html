<div class="tb-login-page">
  <div class="tb-login-background"></div>
  <div class="tb-login-container">
    <div class="tb-login-logo">LIHERO物联网平台</div>
    <div class="tb-login-card">
      <div class="tb-login-card-left">
        <div class="tb-login-icon-wrapper">
          <mat-icon class="tb-login-icon">lock</mat-icon>
        </div>
        <div class="tb-login-language-wrapper">
          <span class="tb-login-language-label">系统语言</span>
          <mat-form-field class="tb-login-language-select" appearance="outline">
            <mat-select [(value)]="currentLang" (selectionChange)="changeLanguage($event.value)">
              <mat-option *ngFor="let lang of languageList" [value]="lang">
                {{ getLangDisplayName(lang) }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
      <div class="tb-login-card-right">
        <form class="tb-login-form" [formGroup]="loginFormGroup" (ngSubmit)="login()">
          <mat-progress-bar color="warn" mode="indeterminate" *ngIf="isLoading$ | async"></mat-progress-bar>
          <span style="height: 4px;" *ngIf="!(isLoading$ | async)"></span>

          <div class="tb-login-form-fields">
            <mat-form-field class="tb-login-field" appearance="outline">
              <mat-icon matPrefix>person</mat-icon>
              <input id="username-input" matInput type="text" autofocus formControlName="username" placeholder="{{ 'login.username' | translate }}"/>
              <mat-error *ngIf="loginFormGroup.get('username').hasError('required') && loginFormGroup.get('username').touched">
                用户名不能为空
              </mat-error>
            </mat-form-field>

            <mat-form-field class="tb-login-field" appearance="outline">
              <mat-icon matPrefix>lock</mat-icon>
              <input id="password-input" matInput type="password" formControlName="password" placeholder="{{ 'common.password' | translate }}"/>
              <tb-toggle-password matSuffix></tb-toggle-password>
            </mat-form-field>

            <div class="tb-login-actions">
              <button class="tb-login-btn" mat-raised-button color="primary" [disabled]="isLoading$ | async" type="submit">
                {{ 'login.login' | translate }}
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="tb-login-footer">
      推荐使用谷歌、360（极速模式）、火狐、Edge浏览器访问系统
    </div>
  </div>
</div>
